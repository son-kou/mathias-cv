# Bygger og udgiver siden på GitHub Pages ved hvert push til main.
#
# Engangsopsætning: Settings → Pages → "Build and deployment" → Source: GitHub Actions.
name: Udgiv på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Kun én udgivelse ad gangen – en ny afløser ikke en igangværende.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installér afhængigheder
        run: npm ci

      - name: Lint og test
        run: |
          npm run lint
          npm test

      - name: Find Pages-adresse
        id: pages
        uses: actions/configure-pages@v6

      - name: Byg
        run: npm run build
        env:
          # Fx "/mathias-cv" og "https://son-kou.github.io/mathias-cv" – virker også med eget domæne.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Udgiv
        id: deployment
        uses: actions/deploy-pages@v5
